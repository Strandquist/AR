<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR-fotoalbum</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
 
    <style>
      html, body { margin: 0; overflow: hidden; }
 
      /* VIKTIGT för att kamerabilden ska synas:
         MindAR lägger kameraströmmen i ett <video> med z-index: -2. Negativa
         z-index målas FÖRE <body>s egen bakgrund, så en opak bakgrund på body
         täcker hela kamerabilden. html-elementets bakgrund blir däremot sidans
         "canvas background" och målas allra underst — därför sitter färgen
         här och body hålls transparent. */
      html { background: #0a0a0a; }
      body { background: transparent; }
 
      /* ============ STARTSKÄRM ============ */
      #start-screen {
        position: fixed; inset: 0;
        background: radial-gradient(circle at 50% 35%, #1a1815 0%, #0a0a0a 70%);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 14px;
        z-index: 10000; transition: opacity 0.8s ease;
        font-family: "Inter", -apple-system, sans-serif;
        text-align: center; padding: 0 30px;
      }
      #start-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
      #start-screen .eyebrow {
        font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
        color: rgba(255,255,255,0.45); margin: 0;
      }
      #start-screen h1 {
        font-family: "Cormorant Garamond", serif; font-weight: 600;
        font-size: 42px; color: #f2ede4; margin: 0; line-height: 1.1;
      }
      #start-screen .sub {
        font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.55);
        max-width: 300px; margin: 4px 0 24px;
      }
      #start-btn {
        font-family: "Inter", sans-serif; font-size: 13px; font-weight: 500;
        letter-spacing: 2.5px; text-transform: uppercase;
        color: #0a0a0a; background: #f2ede4; border: none; border-radius: 999px;
        padding: 16px 42px; cursor: pointer;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      #start-btn:active { transform: scale(0.96); }
      #start-btn:disabled { opacity: 0.5; }
      #start-error { font-size: 13px; color: #e08a8a; margin-top: 16px; display: none; }
 
      /* ============ SKANNINGS-UI ============ */
      #scan-ui {
        position: fixed; inset: 0; z-index: 9000;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
      }
      #scan-ui.visible { opacity: 1; }
      .scan-frame {
        position: relative; width: min(62vw, 300px); aspect-ratio: 1 / 0.75;
        animation: framePulse 2.4s ease-in-out infinite;
      }
      .scan-frame span {
        position: absolute; width: 26px; height: 26px;
        border: 2px solid rgba(255,255,255,0.9);
      }
      .scan-frame span:nth-child(1) { top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:10px; }
      .scan-frame span:nth-child(2) { top:0; right:0; border-left:none; border-bottom:none; border-top-right-radius:10px; }
      .scan-frame span:nth-child(3) { bottom:0; left:0; border-right:none; border-top:none; border-bottom-left-radius:10px; }
      .scan-frame span:nth-child(4) { bottom:0; right:0; border-left:none; border-top:none; border-bottom-right-radius:10px; }
      @keyframes framePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 0.55; }
      }
      #scan-ui p {
        font-family: "Inter", sans-serif; font-size: 12px; letter-spacing: 2.5px;
        text-transform: uppercase; color: rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.45); padding: 10px 20px; border-radius: 999px;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        margin-top: 34px; white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) { .scan-frame { animation: none; } }
    </style>
 
    <script>
      /* =====================================================================
         1. STABILISATOR — vinkelmedveten utjämning av MindAR:s pose
      ===================================================================== */
      AFRAME.registerComponent("stabilizer", {
        schema: {
          posTau:   { default: 0.07 },
          rotTau:   { default: 0.05 },
          scaleTau: { default: 0.16 },
          obliqueBoost: { default: 2.5 }
        },
 
        init: function () {
          const o = this.el.object3D;
          o.matrixAutoUpdate = false;
 
          this.sPos = new THREE.Vector3();
          this.sQuat = new THREE.Quaternion();
          this.sScale = new THREE.Vector3(1, 1, 1);
          this.tPos = new THREE.Vector3();
          this.tQuat = new THREE.Quaternion();
          this.tScale = new THREE.Vector3(1, 1, 1);
 
          this.out = new THREE.Matrix4();
          this.lastWritten = new THREE.Matrix4();
          this.hasWritten = false;
          this.snap = true;
 
          this.normal = new THREE.Vector3();
          this.toCam = new THREE.Vector3();
 
          this.el.addEventListener("targetFound", () => { this.snap = true; });
        },
 
        tick: function (time, dt) {
          const o = this.el.object3D;
          if (!o.visible) { this.snap = true; return; }
          if (!dt) return;
 
          // Läs bara in en NY rå pose från MindAR
          if (!this.hasWritten || !this.lastWritten.equals(o.matrix)) {
            o.matrix.decompose(this.tPos, this.tQuat, this.tScale);
            const s = (this.tScale.x + this.tScale.y + this.tScale.z) / 3;
            this.tScale.set(s, s, s);
          }
 
          if (this.snap) {
            this.sPos.copy(this.tPos);
            this.sQuat.copy(this.tQuat);
            this.sScale.copy(this.tScale);
            this.snap = false;
          } else {
            this.normal.set(0, 0, 1).applyQuaternion(this.tQuat);
            this.toCam.copy(this.tPos).normalize().negate();
            const facing = Math.abs(this.normal.dot(this.toCam));
            const oblique = Math.min(1, Math.max(0, 1 - facing));
 
            const k = 1 + this.data.obliqueBoost * oblique * oblique;
            const secs = dt / 1000;
            const alpha = (tau) => 1 - Math.exp(-secs / (tau * k));
 
            this.sPos.lerp(this.tPos, alpha(this.data.posTau));
            this.sQuat.slerp(this.tQuat, alpha(this.data.rotTau));
            this.sScale.lerp(this.tScale, alpha(this.data.scaleTau));
          }
 
          this.out.compose(this.sPos, this.sQuat, this.sScale);
          o.matrix.copy(this.out);
          this.lastWritten.copy(this.out);
          this.hasWritten = true;
          o.matrixWorldNeedsUpdate = true;
        }
      });
 
      /* =====================================================================
         2. SKARP TEXTUR VID SNEDA VINKLAR (anisotrop filtrering)
      ===================================================================== */
      AFRAME.registerComponent("sharp-texture", {
        init: function () {
          const apply = () => {
            const mesh = this.el.getObject3D("mesh");
            const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
            if (!mesh || !mesh.material || !mesh.material.map || !renderer) return;
            const max = renderer.capabilities.getMaxAnisotropy();
            const map = mesh.material.map;
            if (map.anisotropy === max) return;
            map.anisotropy = max;
            map.minFilter = THREE.LinearFilter;
            map.magFilter = THREE.LinearFilter;
            map.generateMipmaps = false;
            map.needsUpdate = true;
          };
          this.el.addEventListener("loaded", apply);
          this.el.addEventListener("materialtextureloaded", apply);
          this.checks = 0;
          this.interval = setInterval(() => {
            apply();
            if (++this.checks > 20) clearInterval(this.interval);
          }, 500);
        },
        remove: function () { clearInterval(this.interval); }
      });
 
      /* =====================================================================
         3. RUNDADE HÖRN — radien anges nu i VÄRLDSENHETER
 
         Förra versionen byggde alltid en 1024×643-mask, vilket gav ovala
         hörn på allt som inte hade exakt det bildförhållandet — därför fick
         den smala faktarutan inga användbara hörn. Nu byggs masken efter
         elementets faktiska proportioner, och radien anges i samma enhet
         som width/height. Alla element får därmed FYSISKT lika stora hörn
         oavsett form och storlek.
      ===================================================================== */
      AFRAME.registerComponent("rounded-corners", {
        schema: { radius: { default: 0.035 } },
 
        init: function () {
          this.build = this.build.bind(this);
          this.cacheKey = null;
          if (this.el.getObject3D("mesh")) this.build();
          this.el.addEventListener("loaded", this.build);
          this.el.addEventListener("materialtextureloaded", this.build);
          // Bygg om masken om geometrin ändras (t.ex. av fit-to-video)
          this.el.addEventListener("componentchanged", (e) => {
            if (e.detail.name === "geometry") this.build();
          });
        },
 
        build: function () {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh || !mesh.material || !mesh.geometry) return;
 
          const p = mesh.geometry.parameters || {};
          const wWorld = p.width || 1;
          const hWorld = p.height || 1;
 
          const key = wWorld + "x" + hWorld + "x" + this.data.radius;
          if (key === this.cacheKey) return;
          this.cacheKey = key;
 
          // Skala så längsta sidan blir 1024 px — masken följer proportionerna
          const ppu = 1024 / Math.max(wWorld, hWorld);
          const w = Math.round(wWorld * ppu);
          const h = Math.round(hWorld * ppu);
          const r = Math.min(this.data.radius * ppu, Math.min(w, h) / 2);
 
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.arcTo(w, 0, w, h, r);
          ctx.arcTo(w, h, 0, h, r);
          ctx.arcTo(0, h, 0, 0, r);
          ctx.arcTo(0, 0, w, 0, r);
          ctx.closePath();
          ctx.fill();
 
          if (mesh.material.alphaMap) mesh.material.alphaMap.dispose();
          mesh.material.alphaMap = new THREE.CanvasTexture(c);
          mesh.material.transparent = true;
          mesh.material.needsUpdate = true;
        }
      });
 
      /* =====================================================================
         4. VALFRITT: anpassa planets höjd efter videons bildförhållande.
         Lägg till fit-to-video="src: #vid1" på ett <a-video> om videon inte
         har samma proportioner som det tryckta fotot. Utelämna attributet
         om videon redan är filmad för att täcka fotot exakt.
      ===================================================================== */
      AFRAME.registerComponent("fit-to-video", {
        schema: { src: { type: "selector" } },
        init: function () {
          const v = this.data.src;
          if (!v) return;
          const apply = () => {
            if (!v.videoWidth) return;
            const w = parseFloat(this.el.getAttribute("width")) || 1;
            this.el.setAttribute("height", w * (v.videoHeight / v.videoWidth));
          };
          if (v.readyState >= 1) apply();
          v.addEventListener("loadedmetadata", apply);
        }
      });
 
      /* ===================== APP-LOGIK ===================== */
      document.addEventListener("DOMContentLoaded", function () {
        const sceneEl = document.querySelector("a-scene");
        const startScreen = document.querySelector("#start-screen");
        const startBtn = document.querySelector("#start-btn");
        const startError = document.querySelector("#start-error");
        const scanUi = document.querySelector("#scan-ui");
 
        const targets = [
          { target: document.querySelector("#target1"), wrapper: document.querySelector("#wrap1"),
            vid: document.querySelector("#vid1"), aVid: document.querySelector("#a-vid1") },
          { target: document.querySelector("#target2"), wrapper: document.querySelector("#wrap2"),
            vid: document.querySelector("#vid2"), aVid: document.querySelector("#a-vid2") },
          { target: document.querySelector("#target3"), wrapper: document.querySelector("#wrap3"),
            vid: document.querySelector("#vid3"), aVid: document.querySelector("#a-vid3"),
            faktaContainer: document.querySelector("#fakta-container"),
            faktaBg: document.querySelector("#fakta-bg"),
            faktaVidEl: document.querySelector("#a-fakta1"),
            faktaVidFile: document.querySelector("#vid-fakta1") }
        ];
 
        /* --- Håll skärmen tänd medan man bläddrar i albumet --- */
        let wakeLock = null;
        const keepAwake = async () => {
          try {
            if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
          } catch (e) { /* stöds inte — ingen fara */ }
        };
 
        startBtn.addEventListener("click", async () => {
          startBtn.disabled = true;
          startBtn.textContent = "Startar kameran…";
          targets.forEach((i) => (i.vid.muted = false));
          keepAwake();
          try {
            await sceneEl.systems["mindar-image-system"].start();
          } catch (e) {
            startBtn.disabled = false;
            startBtn.textContent = "Försök igen";
            startError.style.display = "block";
          }
        });
 
        sceneEl.addEventListener("arReady", () => {
          startScreen.classList.add("hidden");
          scanUi.classList.add("visible");
        });
        sceneEl.addEventListener("arError", () => {
          startBtn.disabled = false;
          startBtn.textContent = "Försök igen";
          startError.style.display = "block";
        });
 
        let activeCount = 0, scanTimer = null;
        const updateScanUi = () => {
          clearTimeout(scanTimer);
          if (activeCount > 0) scanUi.classList.remove("visible");
          else scanTimer = setTimeout(() => scanUi.classList.add("visible"), 1200);
        };
 
        const playVideo = (item) => {
          clearTimeout(item.timeout);
          clearInterval(item.fadeInterval);
          activeCount++;
          updateScanUi();
 
          if (item.vid.paused) {
            item.vid.currentTime = 0;
            item.vid.volume = 0;
            item.vid.play().catch(() => {});
 
            item.wrapper.removeAttribute("animation__scale");
            item.wrapper.setAttribute("animation__scale", "property: scale; from: 0.93 0.93 0.93; to: 1 1 1; dur: 650; easing: easeOutQuint");
 
            item.aVid.removeAttribute("animation__fade");
            item.aVid.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 1; dur: 600; easing: easeOutQuad");
 
            if (item.faktaContainer) {
              item.faktaVidFile.currentTime = 0;
              item.faktaVidFile.play().catch(() => {});
              item.faktaBg.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 0.6; dur: 800; delay: 300; easing: easeOutQuad");
              item.faktaVidEl.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 1; dur: 800; delay: 300; easing: easeOutQuad");
              item.faktaContainer.setAttribute("animation__slide", "property: position; from: 0 0 0.015; to: 0.75 0 0.015; dur: 800; delay: 300; easing: easeOutQuint");
            }
 
            item.vol = 0;
            item.fadeInterval = setInterval(() => {
              item.vol += 0.05;
              if (item.vol >= 1) { item.vid.volume = 1; clearInterval(item.fadeInterval); }
              else item.vid.volume = item.vol;
            }, 25);
          }
        };
 
        const pauseVideo = (item) => {
          clearInterval(item.fadeInterval);
          activeCount = Math.max(0, activeCount - 1);
          updateScanUi();
 
          item.fadeInterval = setInterval(() => {
            item.vid.volume = Math.max(0, item.vid.volume - 0.1);
            if (item.vid.volume <= 0) clearInterval(item.fadeInterval);
          }, 25);
 
          item.aVid.removeAttribute("animation__fade");
          item.aVid.setAttribute("animation__fade", "property: material.opacity; to: 0; dur: 350; easing: easeInQuad");
 
          item.timeout = setTimeout(() => {
            item.vid.pause();
            item.vid.volume = 0;
            item.aVid.setAttribute("material", "opacity", 0);
            item.wrapper.setAttribute("scale", "1 1 1");
 
            if (item.faktaContainer) {
              item.faktaVidFile.pause();
              item.faktaBg.removeAttribute("animation__fade");
              item.faktaVidEl.removeAttribute("animation__fade");
              item.faktaContainer.removeAttribute("animation__slide");
              item.faktaBg.setAttribute("material", "opacity", 0);
              item.faktaVidEl.setAttribute("material", "opacity", 0);
              item.faktaContainer.setAttribute("position", "0 0 0.015");
            }
          }, 400);
        };
 
        targets.forEach((item) => {
          item.target.addEventListener("targetFound", () => playVideo(item));
          item.target.addEventListener("targetLost", () => pauseVideo(item));
        });
 
        /* --- Byter man flik eller låser telefonen ska inget ljud fortsätta --- */
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            targets.forEach((i) => {
              i.vid.pause();
              if (i.faktaVidFile) i.faktaVidFile.pause();
            });
          } else {
            keepAwake();
            targets.forEach((i) => {
              if (i.target.object3D.visible) {
                i.vid.play().catch(() => {});
                if (i.faktaVidFile) i.faktaVidFile.play().catch(() => {});
              }
            });
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="start-screen">
      <p class="eyebrow">Augmented Reality</p>
      <h1>Fotoalbumet</h1>
      <p class="sub">Rikta kameran mot ett foto i albumet så vaknar det till liv.</p>
      <button id="start-btn">Öppna albumet</button>
      <p id="start-error">Kameran kunde inte startas. Kontrollera att sidan har kameratillstånd.</p>
    </div>
 
    <div id="scan-ui">
      <div class="scan-frame"><span></span><span></span><span></span><span></span></div>
      <p>Rikta kameran mot ett foto</p>
    </div>
 
    <a-scene
      mindar-image="imageTargetSrc: target.mind; autoStart: no; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 10; warmupTolerance: 5; uiLoading: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; precision: high"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="vid1" src="video1.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid2" src="video2.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid3" src="video3.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid-fakta1" src="fakta1.webm" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
      </a-assets>
 
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 
      <!-- Bild 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 0" stabilizer>
        <a-entity id="wrap1">
          <a-video id="a-vid1" src="#vid1" position="0 0 0.035" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!-- Bild 2 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 1" stabilizer>
        <a-entity id="wrap2">
          <a-video id="a-vid2" src="#vid2" position="0 0 0.035" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!-- Bild 3 (med faktaruta) -->
      <a-entity id="target3" mindar-image-target="targetIndex: 2" stabilizer>
        <a-entity id="wrap3">
 
          <!-- Faktarutan har nu samma hörnradie som huvudvideon. Radien är
               angiven i världsenheter, så hörnen blir fysiskt lika stora
               trots att panelen är mycket smalare. -->
          <a-entity id="fakta-container" position="0 0 0.015">
            <a-plane id="fakta-bg" width="0.45" height="0.628" color="#000000"
                     rounded-corners="radius: 0.035"
                     material="shader: flat; opacity: 0; transparent: true"></a-plane>
            <a-video id="a-fakta1" src="#vid-fakta1" width="0.45" height="0.628" position="0 0 0.005"
                     sharp-texture material="shader: flat; opacity: 0; transparent: true"></a-video>
          </a-entity>
 
          <a-video id="a-vid3" src="#vid3" position="0 0 0.035" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
