<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #050505;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.8s ease;
      }
      #loading-overlay p {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #aaaaaa;
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        const overlay = document.querySelector('#loading-overlay');

        sceneEl.addEventListener("renderstart", () => {
          setTimeout(() => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
          }, 600);
        });

        // Struktur för alla targets. 
        // Target 3 har nu en Container som håller både den mörka bakgrunden och textvideon!
        const targets = [
          { target: document.querySelector('#target1'), vid: document.querySelector('#vid1'), aVid: document.querySelector('#a-vid1') },
          { target: document.querySelector('#target2'), vid: document.querySelector('#vid2'), aVid: document.querySelector('#a-vid2') },
          { 
            target: document.querySelector('#target3'), 
            vid: document.querySelector('#vid3'), 
            aVid: document.querySelector('#a-vid3'),
            faktaContainer: document.querySelector('#fakta-container'),
            faktaBg: document.querySelector('#fakta-bg'),
            faktaVidEl: document.querySelector('#a-fakta1'),
            faktaVidFile: document.querySelector('#vid-fakta1')
          }
        ];

        const playVideo = (item) => {
          if (item.vid.paused) {
            // Spela upp safarivideon
            item.vid.currentTime = 0; 
            item.vid.volume = 0; 
            item.vid.play();
            item.aVid.setAttribute('animation', 'property: material.opacity; to: 1; dur: 500; easing: easeInOutQuad');
            
            // ANIMERA FAKTARUTAN OCH TEXTVIDEON
            if (item.faktaContainer) {
              item.faktaVidFile.currentTime = 0;
              item.faktaVidFile.play(); // Starta din textanimation

              // Tona in den mörka bakgrunden till 60% (0.6)
              item.faktaBg.setAttribute('animation__fade', 'property: material.opacity; from: 0; to: 0.6; dur: 800; easing: easeOutQuad');
              // Tona in textvideon till 100% (1.0)
              item.faktaVidEl.setAttribute('animation__fade', 'property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutQuad');
              
              // Glid ut hela rutan från bakom huvudvideon till höger
              item.faktaContainer.setAttribute('animation__slide', 'property: position; from: 0 0 -0.01; to: 0.75 0 -0.01; dur: 800; easing: easeOutQuint');
            }

            // Tona in ljudet för huvudvideon
            item.vol = 0;
            const step = 0.05; 
            item.fadeInterval = setInterval(() => {
              item.vol += step;
              if (item.vol >= 1) {
                item.vid.volume = 1;
                clearInterval(item.fadeInterval);
              } else {
                item.vid.volume = item.vol;
              }
            }, 25);
          }
        };

        const pauseVideo = (item) => {
          clearInterval(item.fadeInterval);
          item.timeout = setTimeout(() => {
            // Pausa och göm safarivideon
            item.vid.pause();
            item.vid.volume = 0;
            item.aVid.removeAttribute('animation');
            item.aVid.setAttribute('material', 'opacity: 0');
            
            // Återställ faktarutan och pausa textvideon
            if (item.faktaContainer) {
              item.faktaVidFile.pause();
              
              item.faktaBg.removeAttribute('animation__fade');
              item.faktaVidEl.removeAttribute('animation__fade');
              item.faktaContainer.removeAttribute('animation__slide');
              
              item.faktaBg.setAttribute('material', 'opacity: 0');
              item.faktaVidEl.setAttribute('material', 'opacity: 0');
              item.faktaContainer.setAttribute('position', '0 0 -0.01'); // Göm tillbaka bakom videon
            }
          }, 500);
        };

        targets.forEach(item => {
          item.target.addEventListener("targetFound", () => playVideo(item));
          item.target.addEventListener("targetLost", () => pauseVideo(item));
        });

        // Starta ljudet vid första klicket
        window.addEventListener('click', () => {
          targets.forEach(item => {
            item.vid.muted = false;
          });
        }, { once: true });
      });
    </script>
  </head>
  <body>
    <div id="loading-overlay">
      <p>Startar kameran...</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: target.mind; filterMinCF: 0.001; filterBeta: 0.01; uiLoading: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="video1.mp4" preload="metadata" loop muted playsinline></video>
        <video id="vid2" src="video2.mp4" preload="metadata" loop muted playsinline></video>
        <video id="vid3" src="video3.mp4" preload="metadata" loop muted playsinline></video>
        
        <!-- Din animerade textvideo (utan svart bakgrund från DaVinci) -->
        <video id="vid-fakta1" src="fakta1.webm" preload="metadata" loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Bild 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-video id="a-vid1" src="#vid1" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
      </a-entity>

      <!-- Bild 2 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 1">
        <a-video id="a-vid2" src="#vid2" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
      </a-entity>

      <!-- Bild 3 -->
      <a-entity id="target3" mindar-image-target="targetIndex: 2">
        
        <!-- Huvudvideon ligger längst fram (Z = 0) -->
        <a-video id="a-vid3" src="#vid3" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
        
        <!-- "Behållaren" som håller både bakgrunden och din text. Startar gömd bakom videon (Z = -0.01) -->
        <a-entity id="fakta-container" position="0 0 -0.01">
          
          <!-- Den mörka, halvt genomskinliga glasrutan ritad direkt i koden (slipper DaVinci-buggar) -->
          <a-plane id="fakta-bg" width="0.45" height="0.628" color="#000000" material="opacity: 0; transparent: true"></a-plane>
          
          <!-- Din textvideo som spelas upp ovanpå glasrutan -->
          <a-video id="a-fakta1" src="#vid-fakta1" width="0.45" height="0.628" position="0 0 0.01" material="opacity: 0; transparent: true"></a-video>
          
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
