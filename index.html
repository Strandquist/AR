<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #050505;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.8s ease;
      }
      #loading-overlay p {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #aaaaaa;
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        const overlay = document.querySelector('#loading-overlay');

        sceneEl.addEventListener("renderstart", () => {
          setTimeout(() => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
          }, 600);
        });

        // Struktur för alla targets. 
        // Target 3 har nu en "extraVid" istället för en statisk bild.
        const targets = [
          { target: document.querySelector('#target1'), vid: document.querySelector('#vid1'), aVid: document.querySelector('#a-vid1'), extraVid: null, aExtra: null, timeout: null, fadeInterval: null },
          { target: document.querySelector('#target2'), vid: document.querySelector('#vid2'), aVid: document.querySelector('#a-vid2'), extraVid: null, aExtra: null, timeout: null, fadeInterval: null },
          { target: document.querySelector('#target3'), vid: document.querySelector('#vid3'), aVid: document.querySelector('#a-vid3'), extraVid: document.querySelector('#vid-fakta1'), aExtra: document.querySelector('#a-fakta1'), timeout: null, fadeInterval: null }
        ];

        const playVideo = (item) => {
          clearTimeout(item.timeout);
          clearInterval(item.fadeInterval);

          if (item.vid.paused) {
            // Spela huvudvideon
            item.vid.currentTime = 0; 
            item.vid.volume = 0; 
            item.vid.play();
            item.aVid.setAttribute('animation', 'property: material.opacity; to: 1; dur: 500; easing: easeInOutQuad');
            
            // Spela faktaruta-videon (om den finns på detta target)
            if (item.extraVid) {
              item.extraVid.currentTime = 0;
              item.extraVid.play();
              item.aExtra.setAttribute('animation', 'property: material.opacity; to: 1; dur: 500; easing: easeInOutQuad');
            }

            // Tona in ljudet för huvudvideon
            let vol = 0;
            const step = 0.05; 
            item.fadeInterval = setInterval(() => {
              vol += step;
              if (vol >= 1) {
                item.vid.volume = 1;
                clearInterval(item.fadeInterval);
              } else {
                item.vid.volume = vol;
              }
            }, 25);
          }
        };

        const pauseVideo = (item) => {
          clearInterval(item.fadeInterval);
          item.timeout = setTimeout(() => {
            // Pausa huvudvideon
            item.vid.pause();
            item.vid.volume = 0;
            item.aVid.removeAttribute('animation');
            item.aVid.setAttribute('material', 'opacity: 0');
            
            // Pausa faktaruta-videon
            if (item.extraVid) {
              item.extraVid.pause();
              item.aExtra.removeAttribute('animation');
              item.aExtra.setAttribute('material', 'opacity: 0');
            }
          }, 500);
        };

        targets.forEach(item => {
          item.target.addEventListener("targetFound", () => playVideo(item));
          item.target.addEventListener("targetLost", () => pauseVideo(item));
        });

        // Starta ljudet vid första klicket
        window.addEventListener('click', () => {
          targets.forEach(item => {
            item.vid.muted = false;
          });
        }, { once: true });
      });
    </script>
  </head>
  <body>
    <div id="loading-overlay">
      <p>Startar kameran...</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: target.mind; filterMinCF: 0.001; filterBeta: 0.01; uiLoading: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="video1.mp4" preload="metadata" loop muted playsinline></video>
        <video id="vid2" src="video2.mp4" preload="metadata" loop muted playsinline></video>
        <video id="vid3" src="video3.mp4" preload="metadata" loop muted playsinline></video>
        
        <!-- Din animerade faktaruta som en WebM-video laddas in här -->
        <video id="vid-fakta1" src="fakta1.webm" preload="metadata" loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Bild 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-video id="a-vid1" src="#vid1" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
      </a-entity>

      <!-- Bild 2 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 1">
        <a-video id="a-vid2" src="#vid2" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
      </a-entity>

      <!-- Bild 3 -->
      <a-entity id="target3" mindar-image-target="targetIndex: 2">
        <!-- Huvudvideon -->
        <a-video id="a-vid3" src="#vid3" position="0 0 0" width="1" height="0.628" scale="1 1 1" material="opacity: 0; transparent: true"></a-video>
        
        <!-- Den animerade faktarutan: Koden är nu en <a-video> istället för <a-image> -->
        <a-video id="a-fakta1" src="#vid-fakta1" position="0.75 0 0" width="0.45" height="0.628" material="opacity: 0; transparent: true"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
