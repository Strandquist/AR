<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Fotoalbumet</title>
 
    <meta name="theme-color" content="#14110E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fotoalbumet" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
 
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
 
    <style>
      html, body { margin: 0; overflow: hidden; }
      html { background: #14110E; }
      body { background: transparent; }
 
      #start-screen {
        position: fixed; inset: 0;
        background: radial-gradient(circle at 50% 35%, #1f1b16 0%, #14110E 70%);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 14px;
        z-index: 10000; transition: opacity 0.8s ease;
        font-family: "Inter", -apple-system, sans-serif;
        text-align: center; padding: 0 30px;
      }
      #start-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
      #start-screen .eyebrow {
        font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
        color: rgba(255,255,255,0.45); margin: 0;
      }
      #start-screen h1 {
        font-family: "Cormorant Garamond", serif; font-weight: 600;
        font-size: 42px; color: #f2ede4; margin: 0; line-height: 1.1;
      }
      #start-screen .sub {
        font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.55);
        max-width: 300px; margin: 4px 0 24px;
      }
      #start-btn {
        font-family: "Inter", sans-serif; font-size: 13px; font-weight: 500;
        letter-spacing: 2.5px; text-transform: uppercase;
        color: #14110E; background: #f2ede4; border: none; border-radius: 999px;
        padding: 16px 42px; cursor: pointer;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      #start-btn:active { transform: scale(0.96); }
      #start-btn:disabled { opacity: 0.5; }
      #start-error { font-size: 13px; color: #e08a8a; margin-top: 16px; display: none; }
 
      #scan-ui {
        position: fixed; inset: 0; z-index: 9000;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
      }
      #scan-ui.visible { opacity: 1; }
      .scan-frame {
        position: relative; width: min(62vw, 300px); aspect-ratio: 1 / 0.75;
        animation: framePulse 2.4s ease-in-out infinite;
      }
      .scan-frame span {
        position: absolute; width: 26px; height: 26px;
        border: 2px solid rgba(255,255,255,0.9);
      }
      .scan-frame span:nth-child(1) { top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:10px; }
      .scan-frame span:nth-child(2) { top:0; right:0; border-left:none; border-bottom:none; border-top-right-radius:10px; }
      .scan-frame span:nth-child(3) { bottom:0; left:0; border-right:none; border-top:none; border-bottom-left-radius:10px; }
      .scan-frame span:nth-child(4) { bottom:0; right:0; border-left:none; border-top:none; border-bottom-right-radius:10px; }
      @keyframes framePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 0.55; }
      }
      #scan-ui p {
        font-family: "Inter", sans-serif; font-size: 12px; letter-spacing: 2.5px;
        text-transform: uppercase; color: rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.45); padding: 10px 20px; border-radius: 999px;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        margin-top: 34px; white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) { .scan-frame { animation: none; } }
 
      #toast {
        position: fixed; left: 16px; right: 16px; bottom: 26px; z-index: 11000;
        font-family: "Inter", sans-serif; font-size: 12px; line-height: 1.5;
        color: #ffe0e0; background: rgba(90,20,20,0.9);
        padding: 12px 16px; border-radius: 10px; text-align: center;
        opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
      }
      #toast.visible { opacity: 1; }
    </style>
 
    <script>
      /* =====================================================================
         1. STABILISATOR — vinkelmedveten utjämning av MindAR:s pose
      ===================================================================== */
      AFRAME.registerComponent("stabilizer", {
        schema: {
          posTau:   { default: 0.07 },
          rotTau:   { default: 0.05 },
          scaleTau: { default: 0.16 },
          obliqueBoost: { default: 2.5 }
        },
        init: function () {
          this.el.object3D.matrixAutoUpdate = false;
          this.sPos = new THREE.Vector3();
          this.sQuat = new THREE.Quaternion();
          this.sScale = new THREE.Vector3(1, 1, 1);
          this.tPos = new THREE.Vector3();
          this.tQuat = new THREE.Quaternion();
          this.tScale = new THREE.Vector3(1, 1, 1);
          this.out = new THREE.Matrix4();
          this.lastWritten = new THREE.Matrix4();
          this.hasWritten = false;
          this.snap = true;
          this.normal = new THREE.Vector3();
          this.toCam = new THREE.Vector3();
          this.el.addEventListener("targetFound", () => { this.snap = true; });
        },
        tick: function (time, dt) {
          const o = this.el.object3D;
          if (!o.visible) { this.snap = true; return; }
          if (!dt) return;
 
          if (!this.hasWritten || !this.lastWritten.equals(o.matrix)) {
            o.matrix.decompose(this.tPos, this.tQuat, this.tScale);
            const s = (this.tScale.x + this.tScale.y + this.tScale.z) / 3;
            this.tScale.set(s, s, s);
          }
 
          if (this.snap) {
            this.sPos.copy(this.tPos);
            this.sQuat.copy(this.tQuat);
            this.sScale.copy(this.tScale);
            this.snap = false;
          } else {
            this.normal.set(0, 0, 1).applyQuaternion(this.tQuat);
            this.toCam.copy(this.tPos).normalize().negate();
            const facing = Math.abs(this.normal.dot(this.toCam));
            const oblique = Math.min(1, Math.max(0, 1 - facing));
            const k = 1 + this.data.obliqueBoost * oblique * oblique;
            const secs = dt / 1000;
            const alpha = (tau) => 1 - Math.exp(-secs / (tau * k));
            this.sPos.lerp(this.tPos, alpha(this.data.posTau));
            this.sQuat.slerp(this.tQuat, alpha(this.data.rotTau));
            this.sScale.lerp(this.tScale, alpha(this.data.scaleTau));
          }
 
          this.out.compose(this.sPos, this.sQuat, this.sScale);
          o.matrix.copy(this.out);
          this.lastWritten.copy(this.out);
          this.hasWritten = true;
          o.matrixWorldNeedsUpdate = true;
        }
      });
 
      /* =====================================================================
         2. SKARP TEXTUR VID SNEDA VINKLAR (anisotrop filtrering)
      ===================================================================== */
      AFRAME.registerComponent("sharp-texture", {
        init: function () {
          const apply = () => {
            const mesh = this.el.getObject3D("mesh");
            const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
            if (!mesh || !mesh.material || !mesh.material.map || !renderer) return false;
            const map = mesh.material.map;
            const max = renderer.capabilities.getMaxAnisotropy();
            if (map.anisotropy !== max) {
              map.anisotropy = max;
              map.minFilter = THREE.LinearFilter;
              map.magFilter = THREE.LinearFilter;
              map.generateMipmaps = false;
              map.needsUpdate = true;
            }
            return true;
          };
          this.el.addEventListener("materialtextureloaded", apply);
          this.checks = 0;
          this.interval = setInterval(() => {
            if (apply() || ++this.checks > 20) clearInterval(this.interval);
          }, 400);
        },
        remove: function () { clearInterval(this.interval); }
      });
 
      /* =====================================================================
         3. RUNDADE HÖRN — formade i geometrin, radien i världsenheter
      ===================================================================== */
      function roundedRectGeometry(w, h, radius, segments) {
        const r = Math.min(radius, Math.min(w, h) / 2);
        const x = -w / 2, y = -h / 2;
        const shape = new THREE.Shape();
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
 
        const geo = new THREE.ShapeGeometry(shape, segments);
        const pos = geo.attributes.position;
        const uv = geo.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          uv.setXY(i, (pos.getX(i) - x) / w, (pos.getY(i) - y) / h);
        }
        uv.needsUpdate = true;
        return geo;
      }
 
      AFRAME.registerComponent("rounded-corners", {
        schema: { radius: { default: 0.035 }, segments: { default: 6 } },
        init: function () {
          this.apply = this.apply.bind(this);
          this.apply();
          this.el.addEventListener("object3dset", this.apply);
          this.el.addEventListener("componentchanged", (e) => {
            if (e.detail.name === "geometry") this.apply();
          });
        },
        apply: function () {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh || !mesh.geometry) return;
          const p = mesh.geometry.parameters;
          if (!p || typeof p.width !== "number") return;
          const geo = roundedRectGeometry(p.width, p.height, this.data.radius, this.data.segments);
          mesh.geometry.dispose();
          mesh.geometry = geo;
        }
      });
 
      /* =====================================================================
         4. MJUK SKUGGA — bygger sin textur efter elementets proportioner
      ===================================================================== */
      AFRAME.registerComponent("soft-shadow", {
        schema: {
          inset:  { default: 0.045 },
          blur:   { default: 0.035 },
          radius: { default: 0.05 }
        },
        init: function () {
          const w = parseFloat(this.el.getAttribute("width"));
          const h = parseFloat(this.el.getAttribute("height"));
          if (!w || !h) return;
 
          const ppu = 700 / Math.max(w, h);
          const W = Math.round(w * ppu);
          const H = Math.round(h * ppu);
          const m = this.data.inset * ppu;
          const r = Math.max(1, this.data.radius * ppu);
          const b = this.data.blur * ppu;
 
          const rw = W - m * 2, rh = H - m * 2;
          if (rw <= 0 || rh <= 0) return;
 
          const c = document.createElement("canvas");
          c.width = W; c.height = H;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#000";
 
          if ("filter" in ctx) {
            ctx.filter = "blur(" + b + "px)";
            if (ctx.roundRect) {
              ctx.beginPath();
              ctx.roundRect(m, m, rw, rh, r);
              ctx.fill();
            } else {
              ctx.fillRect(m, m, rw, rh);
            }
          } else {
            for (let i = 0; i < 14; i++) {
              ctx.fillStyle = "rgba(0,0,0,0.08)";
              const p = Math.max(0, m - i * (b / 8));
              ctx.fillRect(p, p, W - p * 2, H - p * 2);
            }
          }
 
          this.el.setAttribute("material", "src", c.toDataURL());
        }
      });
 
      /* ===================== APP-LOGIK ===================== */
      document.addEventListener("DOMContentLoaded", function () {
        const sceneEl = document.querySelector("a-scene");
        const startScreen = document.querySelector("#start-screen");
        const startBtn = document.querySelector("#start-btn");
        const startError = document.querySelector("#start-error");
        const scanUi = document.querySelector("#scan-ui");
        const toast = document.querySelector("#toast");
 
        /* ---------------------------------------------------------------
           KORTETS GENOMSKINLIGHET
           Gäller hela kortet som en enhet — papper, kant och skugga — så
           att lagren aldrig hamnar i otakt med varandra.
             1.00 = helt tätt, läser tydligast som ett fysiskt kort
             0.94 = värdet nedan, en aning genomskinligt
             under 0.88 börjar den beige kanten synas genom kortets yta
        --------------------------------------------------------------- */
        const CARD_OPACITY = 0.94;
 
        /* ---------------------------------------------------------------
           UPPSÄTTNING
           t = fotots nummer, f = faktakortets nummer (utelämnas om fotot
           saknar kort). Vill du lägga till ett femte foto med kort räcker
           det att lägga till en rad här och kopiera motsvarande HTML-block
           längst ned.
        --------------------------------------------------------------- */
        const LAYOUT = [
          { t: 1 },
          { t: 2 },
          { t: 3, f: 1 },
          { t: 4, f: 2 },
          { t: 5, f: 3 }
        ];
 
        const DEBUG = new URLSearchParams(location.search).has("debug");
        const allVideos = Array.from(document.querySelectorAll("a-assets video"));
 
        /* ---------- Diagnostik ---------- */
        let panel = null, logEl = null;
        if (DEBUG) {
          panel = document.createElement("div");
          panel.style.cssText =
            "position:fixed;left:8px;bottom:8px;right:8px;z-index:11000;" +
            "font:11px/1.45 ui-monospace,Menlo,monospace;color:#d8ffd8;" +
            "background:rgba(0,0,0,0.82);padding:10px 12px;border-radius:8px;" +
            "max-height:44vh;overflow:auto;white-space:pre-wrap;pointer-events:none";
          document.body.appendChild(panel);
          logEl = document.createElement("div");
          logEl.style.cssText = "margin-top:8px;color:#ffd9a8";
        }
        const logLine = (msg) => {
          if (!DEBUG) return;
          const t = new Date().toLocaleTimeString("sv-SE");
          logEl.textContent = (t + "  " + msg + "\n" + logEl.textContent).slice(0, 1200);
        };
        let toastTimer = null;
        const showToast = (msg) => {
          logLine("TOAST: " + msg);
          if (!DEBUG) return;
          toast.textContent = msg;
          toast.classList.add("visible");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("visible"), 6000);
        };
 
        allVideos.forEach((v) => {
          v.addEventListener("error", () => {
            const code = v.error ? v.error.code : 0;
            const codes = { 1: "avbruten", 2: "nätverksfel", 3: "AVKODNINGSFEL", 4: "HITTAS EJ / FORMAT STÖDS EJ" };
            const msg = v.getAttribute("src") + ": " + (codes[code] || "okänt");
            logLine("FEL " + msg);
            if (code === 3 || code === 4) {
              showToast(v.getAttribute("src") + " kan inte spelas i den här webbläsaren. " +
                        "Exportera om som H.264, 8-bitars, 4:2:0.");
            } else {
              showToast("Videofilen kunde inte laddas — " + msg);
            }
          });
        });
 
        if (DEBUG) {
          setInterval(() => {
            panel.textContent = allVideos.map((v) => {
              const st = ["inget", "metadata", "aktuell", "framtida", "klar"][v.readyState];
              return v.id.padEnd(12) + (v.paused ? "PAUSAD " : "spelar ") +
                     "rs=" + st.padEnd(9) + "t=" + v.currentTime.toFixed(1) +
                     (v.muted ? " mutad" : " ljud");
            }).join("\n");
            panel.appendChild(logEl);
          }, 400);
        }
 
        /* ---------- Uppspelning ----------
           Starta alltid mutat; mutad uppspelning tillåts av alla
           webbläsare. Ljudet slås på först när videon bevisligen rullar.
        */
        let pendingRetry = false;
 
        const fadeSoundIn = (v) => {
          clearInterval(v._fade);
          v.muted = false;
          v.volume = 0;
          let vol = 0;
          v._fade = setInterval(() => {
            vol += 0.05;
            if (vol >= 1) { v.volume = 1; clearInterval(v._fade); }
            else { try { v.volume = vol; } catch (e) { clearInterval(v._fade); } }
          }, 25);
        };
 
        const fadeSoundOut = (v) => {
          clearInterval(v._fade);
          v._fade = setInterval(() => {
            const next = Math.max(0, v.volume - 0.1);
            v.volume = next;
            if (next <= 0) clearInterval(v._fade);
          }, 25);
        };
 
        const startMedia = (v, withSound) => {
          if (!v) return;
          clearInterval(v._fade);
          try { v.currentTime = 0; } catch (e) {}
          v.muted = true;
          v.volume = 0;
          const p = v.play();
          if (p && p.then) {
            p.then(() => {
              logLine(v.id + ": spelar");
              if (withSound) fadeSoundIn(v);
            }).catch((e) => {
              if (e.name === "AbortError") return;
              logLine("play() nekad " + v.id + ": " + e.name);
              setTimeout(() => {
                if (!v.paused && v.currentTime > 0) {
                  if (withSound && v.muted) fadeSoundIn(v);
                  return;
                }
                let hint;
                if (e.name === "NotSupportedError") {
                  hint = "filen kan inte avkodas här. Exportera om som H.264, 8-bitars, 4:2:0.";
                } else if (e.name === "NotAllowedError") {
                  hint = "webbläsaren blockerade uppspelningen. Tryck på skärmen och skanna igen.";
                  pendingRetry = true;
                } else {
                  hint = "okänt fel.";
                }
                showToast(v.id + " – " + e.name + ": " + hint);
              }, 700);
            });
          } else if (withSound) {
            fadeSoundIn(v);
          }
        };
 
        /* ---------- Tidsstyrning ---------- */
        const T_VIDEO_FADE  = 600;
        const T_PANEL_FADE  = 550;
        const T_PANEL_SLIDE = 750;
        const T_FAKTA_START = T_PANEL_FADE + 150 + T_PANEL_SLIDE + 250;
 
        // Fotot slutar vid x = 0.5, kortet är 0.30 brett
        const PANEL_X    = 0.68;
        const PANEL_HOME = "0 0 0.02";
 
        /* ---------- Bygg upp listan från LAYOUT ---------- */
        const targets = LAYOUT.map(({ t, f }) => {
          const item = {
            target:  document.querySelector("#target" + t),
            wrapper: document.querySelector("#wrap" + t),
            vid:     document.querySelector("#vid" + t),
            aVid:    document.querySelector("#a-vid" + t),
            active:  false
          };
          if (f) {
            item.faktaContainer = document.querySelector("#fakta-container" + f);
            item.faktaVidFile   = document.querySelector("#vid-fakta" + f);
            item.faktaLayers = [
              { el: document.querySelector("#fakta-shadow" + f), to: 0.22 * CARD_OPACITY },
              { el: document.querySelector("#fakta-rim" + f),    to: 1.00 * CARD_OPACITY },
              { el: document.querySelector("#a-fakta" + f),      to: 1.00 * CARD_OPACITY }
            ];
          }
          return item;
        }).filter((i) => i.target && i.vid && i.aVid);
 
        logLine("Foton i scenen: " + targets.length);
 
        let wakeLock = null;
        const keepAwake = async () => {
          try {
            if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
          } catch (e) {}
        };
 
        const goFullscreen = () => {
          const el = document.documentElement;
          const fn = el.requestFullscreen || el.webkitRequestFullscreen;
          if (!fn) return;
          try {
            const p = fn.call(el);
            if (p && p.catch) p.catch(() => {});
          } catch (e) {}
        };
 
        startBtn.addEventListener("click", async () => {
          startBtn.disabled = true;
          startBtn.textContent = "Startar kameran…";
 
          // Lås upp varje videoelement synkront medan trycket räknas
          allVideos.forEach((v) => {
            v.muted = true;
            const p = v.play();
            if (p && p.catch) p.catch(() => {});
            v.pause();
            try { v.currentTime = 0; } catch (e) {}
          });
 
          keepAwake();
          goFullscreen();
 
          setTimeout(() => {
            const trasiga = allVideos.filter((v) => v.error);
            if (trasiga.length) {
              showToast("Dessa filer kan inte läsas i den här webbläsaren: " +
                        trasiga.map((v) => v.getAttribute("src")).join(", ") +
                        ". Exportera om som H.264, 8-bitars, 4:2:0.");
            }
          }, 2500);
 
          try {
            await sceneEl.systems["mindar-image-system"].start();
          } catch (e) {
            startBtn.disabled = false;
            startBtn.textContent = "Försök igen";
            startError.style.display = "block";
          }
        });
 
        sceneEl.addEventListener("arReady", () => {
          startScreen.classList.add("hidden");
          scanUi.classList.add("visible");
        });
        sceneEl.addEventListener("arError", () => {
          startBtn.disabled = false;
          startBtn.textContent = "Försök igen";
          startError.style.display = "block";
        });
 
        let activeCount = 0, scanTimer = null;
        const updateScanUi = () => {
          clearTimeout(scanTimer);
          if (activeCount > 0) scanUi.classList.remove("visible");
          else scanTimer = setTimeout(() => scanUi.classList.add("visible"), 1200);
        };
 
        const playVideo = (item) => {
          clearTimeout(item.timeout);
          if (item.active) return;
          item.active = true;
          activeCount++;
          updateScanUi();
 
          if (navigator.vibrate) navigator.vibrate(12);
 
          startMedia(item.vid, true);
 
          // Faktavideon väntar tills kortet glidit fram
          clearTimeout(item.faktaTimer);
          if (item.faktaVidFile) {
            try { item.faktaVidFile.currentTime = 0; } catch (e) {}
            item.faktaTimer = setTimeout(() => {
              if (item.active) startMedia(item.faktaVidFile, false);
            }, T_FAKTA_START);
          }
 
          item.wrapper.removeAttribute("animation__scale");
          item.wrapper.setAttribute("animation__scale",
            "property: scale; from: 0.93 0.93 0.93; to: 1 1 1; dur: 650; easing: easeOutQuint");
 
          item.aVid.removeAttribute("animation__fade");
          item.aVid.setAttribute("animation__fade",
            "property: material.opacity; from: 0; to: 1; dur: " + T_VIDEO_FADE + "; easing: easeOutQuad");
 
          if (item.faktaContainer) {
            item.faktaLayers.forEach((l) => {
              if (!l.el) return;
              l.el.removeAttribute("animation__fade");
              l.el.setAttribute("animation__fade",
                "property: material.opacity; from: 0; to: " + l.to +
                "; dur: 300; delay: " + T_PANEL_FADE + "; easing: linear");
            });
            item.faktaContainer.removeAttribute("animation__slide");
            item.faktaContainer.setAttribute("animation__slide",
              "property: position; from: " + PANEL_HOME + "; to: " + PANEL_X + " 0 0.02; " +
              "dur: " + T_PANEL_SLIDE + "; delay: " + (T_PANEL_FADE + 150) + "; easing: easeOutQuint");
          }
        };
 
        const pauseVideo = (item) => {
          if (!item.active) return;
          item.active = false;
          clearTimeout(item.faktaTimer);
          activeCount = Math.max(0, activeCount - 1);
          updateScanUi();
 
          fadeSoundOut(item.vid);
 
          item.aVid.removeAttribute("animation__fade");
          item.aVid.setAttribute("animation__fade",
            "property: material.opacity; to: 0; dur: 350; easing: easeInQuad");
 
          if (item.faktaContainer) {
            item.faktaContainer.removeAttribute("animation__slide");
            item.faktaContainer.setAttribute("animation__slide",
              "property: position; to: " + PANEL_HOME + "; dur: 300; easing: easeInQuad");
            item.faktaLayers.forEach((l) => {
              if (!l.el) return;
              l.el.removeAttribute("animation__fade");
              l.el.setAttribute("animation__fade",
                "property: material.opacity; to: 0; dur: 300; easing: easeInQuad");
            });
          }
 
          item.timeout = setTimeout(() => {
            if (item.active) return;
            item.vid.pause();
            if (item.faktaVidFile) item.faktaVidFile.pause();
            item.aVid.setAttribute("material", "opacity", 0);
            item.wrapper.setAttribute("scale", "1 1 1");
 
            if (item.faktaContainer) {
              item.faktaContainer.removeAttribute("animation__slide");
              item.faktaContainer.setAttribute("position", PANEL_HOME);
              item.faktaLayers.forEach((l) => {
                if (!l.el) return;
                l.el.removeAttribute("animation__fade");
                l.el.setAttribute("material", "opacity", 0);
              });
            }
          }, 400);
        };
 
        targets.forEach((item) => {
          item.target.addEventListener("targetFound", () => playVideo(item));
          item.target.addEventListener("targetLost", () => pauseVideo(item));
        });
 
        window.addEventListener("pointerdown", () => {
          if (!pendingRetry) return;
          pendingRetry = false;
          targets.forEach((i) => {
            if (i.active) {
              startMedia(i.vid, true);
              startMedia(i.faktaVidFile, false);
            }
          });
        });
 
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            allVideos.forEach((v) => v.pause());
          } else {
            keepAwake();
            targets.forEach((i) => {
              if (i.active) {
                startMedia(i.vid, true);
                startMedia(i.faktaVidFile, false);
              }
            });
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="start-screen">
      <p class="eyebrow">Augmented Reality</p>
      <h1>Fotoalbumet</h1>
      <p class="sub">Rikta kameran mot ett foto i albumet så vaknar det till liv.</p>
      <button id="start-btn">Öppna albumet</button>
      <p id="start-error">Kameran kunde inte startas. Kontrollera att sidan har kameratillstånd.</p>
    </div>
 
    <div id="scan-ui">
      <div class="scan-frame"><span></span><span></span><span></span><span></span></div>
      <p>Rikta kameran mot ett foto</p>
    </div>
 
    <div id="toast"></div>
 
    <a-scene
      mindar-image="imageTargetSrc: target.mind; autoStart: no; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 10; warmupTolerance: 5; uiLoading: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true; antialias: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="vid1" src="video1.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid2" src="video2.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid3" src="video3.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid4" src="video4.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid5" src="video5.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
 
        <!-- Faktakorten. Ta bort loop om animationen ska spelas en gång. -->
        <video id="vid-fakta1" src="fakta1.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid-fakta2" src="fakta2.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="vid-fakta3" src="fakta3.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
 
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 
      <!-- Foto 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 0" stabilizer>
        <a-entity id="wrap1">
          <a-video id="a-vid1" src="#vid1" position="0 0 0.04" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!-- Foto 2 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 1" stabilizer>
        <a-entity id="wrap2">
          <a-video id="a-vid2" src="#vid2" position="0 0 0.04" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!--
        Foto 3, med faktakort 1.
        Kortet är 720 x 1508 px, alltså förhållandet 1 : 2,094.
        Höjden följer fotot (0,628), vilket ger bredden
        0,628 x 720 / 1508 = 0,30.
        Byter du kortstorlek: kanten = bredd + 0.008 och höjd + 0.008,
        skuggan = bredd + 0.08 och höjd + 0.09.
      -->
      <a-entity id="target3" mindar-image-target="targetIndex: 2" stabilizer>
        <a-entity id="wrap3">
          <a-entity id="fakta-container1" position="0 0 0.02">
            <a-plane id="fakta-shadow1" width="0.38" height="0.72" position="0.012 -0.016 -0.004"
                     soft-shadow rounded-corners="radius: 0.06"
                     material="shader: flat; color: #FFFFFF; opacity: 0; transparent: true; depthWrite: false"></a-plane>
            <a-plane id="fakta-rim1" width="0.308" height="0.636" position="0 0 -0.002"
                     rounded-corners="radius: 0.039"
                     material="shader: flat; color: #C9BEA8; opacity: 0; transparent: true"></a-plane>
            <a-video id="a-fakta1" src="#vid-fakta1" width="0.30" height="0.628" position="0 0 0"
                     rounded-corners="radius: 0.035" sharp-texture
                     material="shader: flat; opacity: 0; transparent: true"></a-video>
          </a-entity>
 
          <a-video id="a-vid3" src="#vid3" position="0 0 0.04" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!-- Foto 4, med faktakort 2 -->
      <a-entity id="target4" mindar-image-target="targetIndex: 3" stabilizer>
        <a-entity id="wrap4">
          <a-entity id="fakta-container2" position="0 0 0.02">
            <a-plane id="fakta-shadow2" width="0.38" height="0.72" position="0.012 -0.016 -0.004"
                     soft-shadow rounded-corners="radius: 0.06"
                     material="shader: flat; color: #FFFFFF; opacity: 0; transparent: true; depthWrite: false"></a-plane>
            <a-plane id="fakta-rim2" width="0.308" height="0.636" position="0 0 -0.002"
                     rounded-corners="radius: 0.039"
                     material="shader: flat; color: #C9BEA8; opacity: 0; transparent: true"></a-plane>
            <a-video id="a-fakta2" src="#vid-fakta2" width="0.30" height="0.628" position="0 0 0"
                     rounded-corners="radius: 0.035" sharp-texture
                     material="shader: flat; opacity: 0; transparent: true"></a-video>
          </a-entity>
 
          <a-video id="a-vid4" src="#vid4" position="0 0 0.04" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
 
      <!-- Foto 5, med faktakort 3 -->
      <a-entity id="target5" mindar-image-target="targetIndex: 4" stabilizer>
        <a-entity id="wrap5">
          <a-entity id="fakta-container3" position="0 0 0.02">
            <a-plane id="fakta-shadow3" width="0.38" height="0.72" position="0.012 -0.016 -0.004"
                     soft-shadow rounded-corners="radius: 0.06"
                     material="shader: flat; color: #FFFFFF; opacity: 0; transparent: true; depthWrite: false"></a-plane>
            <a-plane id="fakta-rim3" width="0.308" height="0.636" position="0 0 -0.002"
                     rounded-corners="radius: 0.039"
                     material="shader: flat; color: #C9BEA8; opacity: 0; transparent: true"></a-plane>
            <a-video id="a-fakta3" src="#vid-fakta3" width="0.30" height="0.628" position="0 0 0"
                     rounded-corners="radius: 0.035" sharp-texture
                     material="shader: flat; opacity: 0; transparent: true"></a-video>
          </a-entity>
 
          <a-video id="a-vid5" src="#vid5" position="0 0 0.04" width="1" height="0.628"
                   rounded-corners="radius: 0.035" sharp-texture
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
