!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR-fotoalbum</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
 
    <style>
      html, body { margin: 0; overflow: hidden; }
 
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #050505;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.8s ease;
      }
      #loading-overlay p {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #aaaaaa;
        margin: 0;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255,255,255,0.15);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
 
      /* Diskret hjälptext som visas tills första bilden hittas */
      #scan-hint {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.45);
        padding: 10px 18px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 9000;
        transition: opacity 0.6s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      #scan-hint.hidden { opacity: 0; }
 
      /* Ljud-hint som försvinner efter första klicket */
      #sound-hint {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
        z-index: 9000;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }
      #sound-hint.hidden { opacity: 0; }
    </style>
 
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const sceneEl = document.querySelector("a-scene");
        const overlay = document.querySelector("#loading-overlay");
        const scanHint = document.querySelector("#scan-hint");
        const soundHint = document.querySelector("#sound-hint");
 
        sceneEl.addEventListener("renderstart", () => {
          setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => (overlay.style.display = "none"), 800);
          }, 600);
        });
 
        const targets = [
          { target: document.querySelector("#target1"), vid: document.querySelector("#vid1"), aVid: document.querySelector("#a-vid1") },
          { target: document.querySelector("#target2"), vid: document.querySelector("#vid2"), aVid: document.querySelector("#a-vid2") },
          {
            target: document.querySelector("#target3"),
            vid: document.querySelector("#vid3"),
            aVid: document.querySelector("#a-vid3"),
            faktaContainer: document.querySelector("#fakta-container"),
            faktaBg: document.querySelector("#fakta-bg"),
            faktaVidEl: document.querySelector("#a-fakta1"),
            faktaVidFile: document.querySelector("#vid-fakta1"),
          },
        ];
 
        const playVideo = (item) => {
          // VIKTIG FIX: avbryt en pågående "pausa snart"-timer.
          // Utan detta gömdes videon om bilden tappades och hittades igen inom 500 ms.
          clearTimeout(item.timeout);
          clearInterval(item.fadeInterval);
 
          if (item.vid.paused) {
            item.vid.currentTime = 0;
            item.vid.volume = 0;
            item.vid.play().catch(() => {});
 
            // Mjuk fade + liten "väx fram"-skala ger en mer levande start
            item.aVid.removeAttribute("animation__fade");
            item.aVid.removeAttribute("animation__scale");
            item.aVid.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 1; dur: 600; easing: easeOutQuad");
            item.aVid.setAttribute("animation__scale", "property: scale; from: 0.94 0.94 0.94; to: 1 1 1; dur: 600; easing: easeOutQuint");
 
            if (item.faktaContainer) {
              item.faktaVidFile.currentTime = 0;
              item.faktaVidFile.play().catch(() => {});
 
              item.faktaBg.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 0.6; dur: 800; delay: 250; easing: easeOutQuad");
              item.faktaVidEl.setAttribute("animation__fade", "property: material.opacity; from: 0; to: 1; dur: 800; delay: 250; easing: easeOutQuad");
              // Faktarutan glider ut åt sidan, med liten fördröjning så huvudvideon hinner landa först
              item.faktaContainer.setAttribute("animation__slide", "property: position; from: 0 0 -0.05; to: 0.75 0 -0.05; dur: 800; delay: 250; easing: easeOutQuint");
            }
 
            // Volym-fade in
            item.vol = 0;
            item.fadeInterval = setInterval(() => {
              item.vol += 0.05;
              if (item.vol >= 1) {
                item.vid.volume = 1;
                clearInterval(item.fadeInterval);
              } else {
                item.vid.volume = item.vol;
              }
            }, 25);
          }
 
          // Göm skanningshjälpen när första bilden hittats
          scanHint.classList.add("hidden");
        };
 
        const pauseVideo = (item) => {
          clearInterval(item.fadeInterval);
 
          // Snabb volym-fade ut så ljudet inte klipps abrupt
          item.fadeInterval = setInterval(() => {
            item.vid.volume = Math.max(0, item.vid.volume - 0.1);
            if (item.vid.volume <= 0) clearInterval(item.fadeInterval);
          }, 25);
 
          // Mjuk fade ut istället för att bara försvinna
          item.aVid.removeAttribute("animation__fade");
          item.aVid.setAttribute("animation__fade", "property: material.opacity; to: 0; dur: 350; easing: easeInQuad");
 
          item.timeout = setTimeout(() => {
            item.vid.pause();
            item.vid.volume = 0;
            item.aVid.setAttribute("material", "opacity", 0);
            item.aVid.setAttribute("scale", "1 1 1");
 
            if (item.faktaContainer) {
              item.faktaVidFile.pause();
              item.faktaBg.removeAttribute("animation__fade");
              item.faktaVidEl.removeAttribute("animation__fade");
              item.faktaContainer.removeAttribute("animation__slide");
              item.faktaBg.setAttribute("material", "opacity", 0);
              item.faktaVidEl.setAttribute("material", "opacity", 0);
              item.faktaContainer.setAttribute("position", "0 0 -0.05");
            }
          }, 400);
        };
 
        targets.forEach((item) => {
          item.target.addEventListener("targetFound", () => playVideo(item));
          item.target.addEventListener("targetLost", () => pauseVideo(item));
        });
 
        // Första klicket låser upp ljudet (krav i mobilwebbläsare)
        window.addEventListener(
          "click",
          () => {
            targets.forEach((item) => (item.vid.muted = false));
            soundHint.classList.add("hidden");
          },
          { once: true }
        );
      });
    </script>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Startar kameran...</p>
    </div>
 
    <div id="scan-hint">Rikta kameran mot ett foto</div>
    <div id="sound-hint">Tryck på skärmen för ljud</div>
 
    <!--
      Tracking-inställningar:
      - filterBeta höjd från 0.01 till 10: din gamla inställning gav extremt mjuk
        men "flytande" video som släpade efter när du rörde telefonen. 10 ger en
        bra balans mellan stabilitet och respons. Testa 1–100 efter smak
        (lägre = mjukare/segare, högre = snabbare/skakigare).
      - missTolerance/warmupTolerance minskar blinkande när trackingen
        tillfälligt tappar bilden i en enstaka frame.
      - antialias: true ger skarpare kanter på videoplanen.
    -->
    <a-scene
      mindar-image="imageTargetSrc: target.mind; filterMinCF: 0.0001; filterBeta: 10; missTolerance: 5; warmupTolerance: 5; uiLoading: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- preload="auto" gör att videon kan starta direkt utan svart blixt
             första gången ett foto skannas -->
        <video id="vid1" src="video1.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid2" src="video2.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid3" src="video3.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        <video id="vid-fakta1" src="fakta1.webm" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
      </a-assets>
 
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 
      <!-- Bild 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-video id="a-vid1" src="#vid1" position="0 0 0" width="1" height="0.628"
                 material="shader: flat; opacity: 0; transparent: true"></a-video>
      </a-entity>
 
      <!-- Bild 2 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 1">
        <a-video id="a-vid2" src="#vid2" position="0 0 0" width="1" height="0.628"
                 material="shader: flat; opacity: 0; transparent: true"></a-video>
      </a-entity>
 
      <!-- Bild 3 -->
      <a-entity id="target3" mindar-image-target="targetIndex: 2">
 
        <!-- Faktarutan ligger bakom huvudvideon (-0.05) och glider ut åt sidan -->
        <a-entity id="fakta-container" position="0 0 -0.05">
          <a-plane id="fakta-bg" width="0.45" height="0.628" color="#000000"
                   material="shader: flat; opacity: 0; transparent: true"></a-plane>
          <a-video id="a-fakta1" src="#vid-fakta1" width="0.45" height="0.628" position="0 0 0.01"
                   material="shader: flat; opacity: 0; transparent: true"></a-video>
        </a-entity>
 
        <!-- Huvudvideon lite längre fram (0.01) -->
        <a-video id="a-vid3" src="#vid3" position="0 0 0.01" width="1" height="0.628"
                 material="shader: flat; opacity: 0; transparent: true"></a-video>
 
      </a-entity>
    </a-scene>
  </body>
</html>
